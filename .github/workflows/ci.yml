name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: soul-studio
      # TEMPORARY: the cookie SameSite/Secure, GET /api/tables/:name
      # foreignKeys, and JWT jti fixes this suite depends on aren't on a
      # published `soul-cli` release yet -- checking out the backend
      # branch that has them directly. Switch this to `thevahidal/soul`'s
      # default branch (and drop SOUL_BACKEND_CWD) once merged.
      - uses: actions/checkout@v4
        with:
          repository: thevahidal/soul
          ref: studio-cookie-samesite
          path: soul
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: soul-studio/package-lock.json
      - working-directory: soul
        run: npm ci
      - working-directory: soul-studio
        run: npm ci
      - working-directory: soul-studio
        run: npx playwright install --with-deps chromium
      - working-directory: soul-studio
        run: npm run test:e2e
        env:
          SOUL_BACKEND_CWD: ${{ github.workspace }}/soul
